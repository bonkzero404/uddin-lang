# Site settings
title: "Uddin Programming Language Documentation"
description: "Complete documentation and tutorials for Uddin Programming Language - a modern, expressive scripting language with powerful built-in functions."
baseurl: "/uddin-lang" # the subpath of your site, e.g. /blog
url: "https://bonkzero404.github.io" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
header_pages:
  - index.md
  - tutorial/index.md
  - reference/index.md
  - builtin-functions/index.md
  - examples/index.md
  - advanced/index.md

# Collections
collections:
  tutorials:
    output: true
    permalink: /:collection/:name/
  examples:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "tutorials"
    values:
      layout: "tutorial"
  - scope:
      path: ""
      type: "examples"
    values:
      layout: "example"

# Syntax highlighting
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true

# SEO settings
author: "Uddin Lang Team"
twitter:
  username: uddinlang
  card: summary

social:
  name: Uddin Programming Language
  links:
    - https://github.com/bonkzero404/uddin-lang

# Google Analytics (optional)
# google_analytics: UA-XXXXXXXX-X

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE

# Include files
include:
  - _pages

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Code highlighting theme
code_theme: "github"

# Custom variables
uddin_lang:
  version: "1.0.0"
  github_repo: "https://github.com/bonkzero404/uddin-lang"
  download_url: "https://github.com/bonkzero404/uddin-lang/releases"
  documentation_url: "https://bonkzero404.github.io/uddin-lang"